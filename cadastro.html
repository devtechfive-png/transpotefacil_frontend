<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Transporte Fácil</title>

    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

    <main class="cadastro-container">

        <section class="cadastro-card">

            <h1>Transporte Fácil</h1>

            <p class="subtitulo">
                Crie sua conta
            </p>


            <!-- FORMULÁRIO -->

            <form id="formCadastro">

                <!-- NOME -->

                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- E-MAIL -->

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- SENHA -->

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="senha-container">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Crie uma senha"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarSenha"
                            class="btn-senha"
                            aria-label="Mostrar senha"
                        >
                            👁
                        </button>

                    </div>

                    <small>
                        A senha deve possuir pelo menos 6 caracteres.
                    </small>

                </div>


                <!-- CONFIRMAR SENHA -->

                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <div class="senha-container">

                        <input
                            type="password"
                            id="confirmarSenha"
                            name="confirmarSenha"
                            placeholder="Digite a senha novamente"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarConfirmarSenha"
                            class="btn-senha"
                            aria-label="Mostrar confirmação da senha"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- MENSAGEM -->

                <p
                    id="mensagem"
                    class="mensagem"
                    aria-live="polite"
                ></p>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn-cadastrar"
                >
                    Criar minha conta
                    <span>→</span>
                </button>

            </form>


            <!-- LOGIN -->

            <div class="area-login">

                <p>
                    Já possui uma conta?
                </p>

                <a href="login.html">
                    Entrar na minha conta →
                </a>

            </div>


            <!-- RESPONSÁVEL -->

            <div class="area-responsavel">

                <p>
                    Você é responsável por alguma empresa?
                </p>

                <a href="area_responsavel.html">
                    Acesse sua área de responsável →
                </a>

            </div>


            <!-- VOLTAR -->

            <button
                type="button"
                id="btnVoltar"
                class="btn-voltar"
            >
                ← Voltar
            </button>

        </section>

    </main>


    <script src="js/cadastro.js"></script>

</body>

</html>
